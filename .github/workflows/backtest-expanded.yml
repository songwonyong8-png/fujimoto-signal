name: Compare 15 assets A B C
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: expanded-research
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Run 15-asset A/B/C study
        run: python backtest_15.py
      - name: Upload research results (even if a data source fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-backtest-results
          path: reports/expanded/
          if-no-files-found: warn
      - name: Commit research results
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/expanded/
          git diff --cached --quiet || (git commit -m 'Add 15-asset A B C validation reports' && git push)
