
name: F v2 RSI MACD Ichimoku 50 stocks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Run tests
        run: python -m unittest test_backtest_f_v2.py -v

      - name: Run F v2
        run: python backtest_f_v2.py

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-v2-results
          path: reports/f_signal_126/
          if-no-files-found: warn

      - name: Commit results
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/f_signal_126/
          git diff --cached --quiet || (git commit -m 'Add F v2 signal based research' && git push)
