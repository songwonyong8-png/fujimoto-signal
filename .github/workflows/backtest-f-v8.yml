name: F v8 Outlier Robustness and Indicator Win Rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backtest_f_v8.py
      - test_backtest_f_v8.py
      - .github/workflows/backtest-f-v8.yml

permissions:
  contents: write

concurrency:
  group: f-v8-indicator-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      F6_FUNDAMENTAL_GATE: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Test historical and new rules
        run: python -m unittest test_backtest_f_v3.py test_backtest_f_v4.py test_backtest_f_v5.py test_backtest_f_v6.py test_backtest_f_v7.py test_backtest_f_v8.py -v

      - name: Run outlier exclusions and signal efficacy research
        run: python backtest_f_v8.py

      - name: Upload even partial study files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-v8-indicator-results
          path: reports/f_signal_robustness_v8/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit report files
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/f_signal_robustness_v8/
          if ! git diff --cached --quiet; then
            git commit -m 'Add F8 outlier robustness and indicator win rate study'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
