name: D exit risk comparison
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fujimoto-d-exit-research
  cancel-in-progress: false
jobs:
  d-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research libraries
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Run deterministic execution checks
        run: python -m unittest test_backtest_d.py -v
      - name: Run fixed A-entry D0-D4 research
        run: python backtest_d.py
      - name: Archive research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-exit-research-results
          path: reports/exit_rules/
          if-no-files-found: warn
      - name: Publish research results
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/exit_rules/
          git diff --cached --quiet || (git commit -m 'Add D exit rule research reports' && git push)
