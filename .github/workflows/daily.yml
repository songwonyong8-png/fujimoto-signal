name: Daily OHLCV and F9-A iPhone Signals

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_data.py
      - signal_snapshot.py
      - test_signal_snapshot.py
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: fujimoto-pwa-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Test trading decisions match F9 rules
        run: python -m unittest test_signal_snapshot.py test_backtest_f_v9.py -v

      - name: Refresh OHLCV and F9-A staged account snapshots
        run: python update_data.py

      - name: Commit refreshed public data
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh F9-A iPhone signals and OHLCV'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
