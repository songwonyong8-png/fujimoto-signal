name: Daily F9-A 200-stock iPhone Screener

on:
  schedule:
    # Korea: Mon-Fri 16:30 KST, after KRX 15:30 close + 60 min
    - cron: '30 7 * * 1-5'
    # US: Tue-Sat 08:30 KST; after 16:00 ET close even in US winter time
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fujimoto-pwa-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      F6_FUNDAMENTAL_GATE: 'off'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific and market data dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Verify F9 buy/exit rules and the 200-stock screener
        run: python -m unittest test_signal_snapshot.py test_backtest_f_v9.py test_screener_f9a.py -v

      - name: Update 200-stock screener from latest completed daily bars
        run: python update_screener.py

      - name: Keep four detailed OHLCV panels current
        run: python update_data.py

      - name: Show market-specific data freshness
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path('data/screener_f9a.json').read_text(encoding='utf-8'))
          print('Snapshot UTC time:',d.get('updated_at'))
          for market in ('KOSPI','NASDAQ100','ETF'):
              rows=[x for x in d['stocks'] if x['market']==market]
              dates=Counter((x.get('asof') or 'UNAVAILABLE') for x in rows)
              print(f'{market}: {len(rows)} symbols, close-date counts={dict(dates)}')
          PY

      - name: Commit public market data only (never personal holdings)
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 200-stock F9-A daily screener and OHLCV'
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
