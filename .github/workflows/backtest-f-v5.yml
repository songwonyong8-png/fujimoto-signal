
name: F v5 Signal-by-Signal Exit Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backtest_f_v5.py
      - test_backtest_f_v5.py
      - .github/workflows/backtest-f-v5.yml

permissions:
  contents: write

concurrency:
  group: f-v5-signal-exit
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Test v3, v4 and v5 regression rules
        run: python -m unittest test_backtest_f_v3.py test_backtest_f_v4.py test_backtest_f_v5.py -v

      - name: Run F v5 backtest and matched first-signal comparisons
        run: python backtest_f_v5.py

      - name: Upload results even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-v5-signal-exit-results
          path: reports/f_signal_independent_v5/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit successful reports
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/f_signal_independent_v5/
          if ! git diff --cached --quiet; then
            git commit -m 'Add F v5 individual lot exit comparisons'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
