
name: F v4 Reverse Signal Exit 50 stocks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backtest_f_v4.py
      - test_backtest_f_v4.py
      - .github/workflows/backtest-f-v4.yml

permissions:
  contents: write

concurrency:
  group: f-v4-reverse-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Run offline unit tests
        run: python -m unittest test_backtest_f_v4.py -v

      - name: Execute F v4 reverse-exit study
        run: python backtest_f_v4.py

      - name: Upload complete or partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-v4-reverse-results
          path: reports/f_signal_reverse_v4/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit report files
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/f_signal_reverse_v4/
          git diff --cached --quiet || (git commit -m 'Add F v4 reverse exit backtest report' && git pull --rebase && git push)
