name: F v6 Article-Inspired Ichimoku and RSI Exits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backtest_f_v6.py
      - test_backtest_f_v6.py
      - .github/workflows/backtest-f-v6.yml
      - research_inputs/fundamentals_asof.csv

permissions:
  contents: write

concurrency:
  group: f-v6-article-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Do not apply retrospective fundamental growth filters without
      # publication-date-aware historical inputs.
      F6_FUNDAMENTAL_GATE: 'off'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'

      - name: Verify v3 through v6 signals and exits
        run: python -m unittest test_backtest_f_v3.py test_backtest_f_v4.py test_backtest_f_v5.py test_backtest_f_v6.py -v

      - name: Run F6 backtest and matched F5 comparisons
        run: python backtest_f_v6.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-v6-article-study-results
          path: reports/f_signal_article_v6/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit successful report to main
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/f_signal_article_v6/
          if ! git diff --cached --quiet; then
            git commit -m 'Add F v6 article-inspired trading backtest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
